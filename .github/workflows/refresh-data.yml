name: Refresh the Cross-Product Response Atlas family

# The build job reads public sibling data but has no write token. Its four data
# outputs cross two independent receipt checks and a fresh read-only contract job
# before the publisher receives them. The publisher never deserializes incoming RDS.
# The publisher never pushes master: it proposes the validated family on the fixed
# review branch automation/atlas-data-refresh. A person reviews and merges that PR;
# the merge to master is the deploy, and post-deploy.yml then verifies the live app.
on:
  schedule:
    # Every Saturday 13:17 UTC == 06:17 America/Phoenix (no DST), clear of the
    # UTC-midnight edge. Cron cannot say "Nth Saturday of the month", so it fires
    # weekly and the gate job's shared calendar block picks the refresh week.
    - cron: "17 13 * * 6"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the validated candidate to the review branch automation/atlas-data-refresh (a person merges its PR; the merge to master is the deploy). Leave false for a rebuild-only dry run that still runs every gate."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neon-cascade-refresh
  cancel-in-progress: false

env:
  BUILD_SHA: ${{ github.sha }}
  RSPM: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15
  # Match CI's fixed numeric runtime so refreshed artifacts use the same release
  # byte contract on heterogeneous hosted x64 runners.
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_WEEK: "2"
        run: |
          # Shared NEON-suite calendar gate. Keep this block byte-identical in every
          # repo; only the REFRESH_WEEK value above it differs. The cron fires every
          # Saturday 13:17 UTC (06:17 America/Phoenix, no DST). GitHub can start a
          # scheduled run hours late, so the gate judges the Saturday the run was
          # scheduled for, not the wall clock: it steps back to the most recent Phoenix
          # Saturday (today, on a Saturday) and proceeds only when that Saturday falls in
          # week REFRESH_WEEK of its month (week 1 = days 1-7, week 2 = days 8-14).
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Calendar gate: $EVENT_NAME run, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          started=$(TZ='America/Phoenix' date -d "@$now" '+%F %H:%M')
          dow=$(TZ='America/Phoenix' date -d "@$now" +%u)   # 1 = Monday ... 6 = Saturday, 7 = Sunday
          lag_days=$(( (dow + 1) % 7 ))                     # whole days since the most recent Saturday
          saturday_at=$(( now - lag_days * 86400 ))         # Phoenix has no DST, so a day is 86400 s
          saturday=$(TZ='America/Phoenix' date -d "@$saturday_at" +%F)
          saturday_week=$(( ($(TZ='America/Phoenix' date -d "@$saturday_at" +%-d) + 6) / 7 ))
          today_week=$(( ($(TZ='America/Phoenix' date -d "@$now" +%-d) + 6) / 7 ))
          if [ "$saturday_week" = "$REFRESH_WEEK" ]; then
            echo "Calendar gate: run for Saturday $saturday (week $saturday_week) started $started Phoenix, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIPPED_BY_CALENDAR: run for Saturday $saturday is week $saturday_week, not week $REFRESH_WEEK (started $started Phoenix)." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$today_week" = "$REFRESH_WEEK" ]; then
              echo "::warning title=Refresh skipped in its refresh week::Saturday $saturday is week $saturday_week, but this run started $started Phoenix, inside week $REFRESH_WEEK. Confirm the week-$REFRESH_WEEK Saturday run proceeds."
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  rebuild:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout immutable reviewed build code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Install build and runtime dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: shiny, bslib@0.11.0, bsicons, dplyr, plotly@4.12.0, htmltools, htmlwidgets, shinyjs, shinycssloaders, DT, tidyr, stringr, tibble, metafor@5.0-1, rsconnect, jsonlite, cpp11
          pak-version: stable
          dependencies: '"hard"'
          cache-version: cascade-ppm-2026-07-15-v2
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Verify the deterministic OpenBLAS runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes

          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          lib.openblas_get_config.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          config = lib.openblas_get_config().decode("ascii")
          print(f"OpenBLAS core={core} threads={threads} config={config}")
          if core.lower() != "haswell":
              raise SystemExit(f"expected OpenBLAS Haswell core, got {core!r}")
          if threads != 1:
              raise SystemExit(f"expected one OpenBLAS thread, got {threads}")
          PY

      - name: Validate committed baseline before external source access
        env:
          CASCADE_ROOT: ""
        run: |
          set -euo pipefail
          Rscript --vanilla -e 'for (f in c("global.R","ui.R","server.R","R/cascade_helpers.R","R/site_metadata.R")) parse(f); source("global.R"); source("ui.R"); source("server.R")'
          node --check www/cascade.js
          PYTHONDONTWRITEBYTECODE=1 python scripts/test_trusted_publish.py
          Rscript --vanilla scripts/workflow_guard.R self-test
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/test_coverage_regression.R
          Rscript --vanilla scripts/test_suite_synthesis.R
          Rscript --vanilla scripts/verify_manifest.R
          Rscript --vanilla scripts/workflow_guard.R approved-sources "$RUNNER_TEMP/approved-sources.tsv"
          test "$(wc -l < "$RUNNER_TEMP/approved-sources.tsv")" -eq 7

      - name: Fetch current data from the seven fixed origins and detach
        run: |
          set -euo pipefail
          ws="$RUNNER_TEMP/siblings"
          mkdir -p "$ws"
          while IFS=$'\t' read -r product directory origin; do
            test -n "$product" && test -n "$directory"
            test "${origin#github.com/tgilbert14/}" != "$origin"
            repo="$ws/$directory"
            git init -q "$repo"
            git -C "$repo" remote add origin "https://${origin}.git"
            git -C "$repo" fetch --quiet --no-tags --depth=1 origin HEAD
            commit=$(git -C "$repo" rev-parse FETCH_HEAD)
            test "${#commit}" -eq 40
            git -C "$repo" -c advice.detachedHead=false checkout --quiet --detach "$commit"
            test "$(git -C "$repo" rev-parse HEAD)" = "$commit"
            git -C "$repo" diff --quiet --ignore-space-at-eol -- .
            git -C "$repo" diff --cached --quiet -- .
          done < "$RUNNER_TEMP/approved-sources.tsv"
          test "$(find "$ws" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 7
          echo "CASCADE_ROOT=$ws" >> "$GITHUB_ENV"

      - name: Rebuild and validate the complete artifact family
        run: Rscript --vanilla scripts/rebuild_all.R

      # Refuses a candidate that loses coverage against the committed baseline
      # (exit 1) unless a reviewed row in data/coverage-overrides.tsv, keyed to
      # this candidate's exact sibling commit, accepts that one rule. A refusal
      # skips staging, so nothing reaches validate-artifacts or the publisher.
      - name: Refuse a coverage regression against the committed baseline
        id: coverage_gate
        run: |
          set -euo pipefail
          git show HEAD:data/cascade.rds > "$RUNNER_TEMP/cascade-baseline.rds"
          Rscript --vanilla scripts/check_coverage_regression.R \
            "$RUNNER_TEMP/cascade-baseline.rds" data/cascade.rds \
            --overrides data/coverage-overrides.tsv --summary "$GITHUB_STEP_SUMMARY"

      # Report-only. Runs after a coverage refusal too, so the moved mosquito
      # site-years are visible exactly when the gate stops the run.
      - name: Report mosquito effort-basis deltas against the committed baseline
        if: ${{ !cancelled() && steps.coverage_gate.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/report_mosq_effort_delta.R \
            "$RUNNER_TEMP/cascade-baseline.rds" data/cascade.rds "$GITHUB_STEP_SUMMARY"

      - name: Stage exactly four data artifacts and write SHA-256 receipt
        run: |
          set -euo pipefail
          test ! -e outgoing
          mkdir -p outgoing/data
          install -m 0644 data/cascade.rds outgoing/data/cascade.rds
          install -m 0644 data/search_index.rds outgoing/data/search_index.rds
          install -m 0644 data/cascade_meta.rds outgoing/data/cascade_meta.rds
          install -m 0644 data/neon-cascade-codebook.csv outgoing/data/neon-cascade-codebook.csv
          Rscript --vanilla scripts/workflow_guard.R write-receipt "$BUILD_SHA" outgoing outgoing/artifact-receipt.tsv
          Rscript --vanilla scripts/workflow_guard.R verify-receipt "$BUILD_SHA" outgoing outgoing/artifact-receipt.tsv

      - name: Upload data artifacts and receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-cascade-data
          retention-days: 1
          if-no-files-found: error
          path: outgoing/

  validate-artifacts:
    needs: [gate, rebuild]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the same immutable trusted validators
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Install validation dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: shiny, bslib@0.11.0, bsicons, dplyr, plotly@4.12.0, htmltools, htmlwidgets, shinyjs, shinycssloaders, DT, tidyr, stringr, tibble, metafor@5.0-1, rsconnect, jsonlite, cpp11
          pak-version: stable
          dependencies: '"hard"'
          cache-version: cascade-ppm-2026-07-15-v2
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Verify the deterministic OpenBLAS runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes

          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          lib.openblas_get_config.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          config = lib.openblas_get_config().decode("ascii")
          print(f"OpenBLAS core={core} threads={threads} config={config}")
          if core.lower() != "haswell":
              raise SystemExit(f"expected OpenBLAS Haswell core, got {core!r}")
          if threads != 1:
              raise SystemExit(f"expected one OpenBLAS thread, got {threads}")
          PY

      - name: Download candidate data into an isolated directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-cascade-data
          path: incoming

      - name: Verify receipt, promote four files locally, and rerun contracts
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/verify_manifest.R
          python scripts/trusted_publish.py verify-receipt "$BUILD_SHA" incoming
          install -m 0644 incoming/data/cascade.rds data/cascade.rds
          install -m 0644 incoming/data/search_index.rds data/search_index.rds
          install -m 0644 incoming/data/cascade_meta.rds data/cascade_meta.rds
          install -m 0644 incoming/data/neon-cascade-codebook.csv data/neon-cascade-codebook.csv
          python scripts/trusted_publish.py update-manifest manifest.json
          python scripts/trusted_publish.py verify-manifest manifest.json
          Rscript --vanilla -e 'for (f in c("global.R","ui.R","server.R","R/cascade_helpers.R","R/site_metadata.R")) parse(f); source("global.R"); source("ui.R"); source("server.R")'
          node --check www/cascade.js
          PYTHONDONTWRITEBYTECODE=1 python scripts/test_trusted_publish.py
          Rscript --vanilla scripts/workflow_guard.R self-test
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/test_coverage_regression.R
          Rscript --vanilla scripts/test_suite_synthesis.R

  publish:
    needs: [gate, rebuild, validate-artifacts]
    # A manual dry run (publish=false, the default) still executes every build and
    # validation gate; it only withholds the review branch. This condition can
    # narrow publication, never widen it: scheduled runs are unaffected. Nothing in
    # this workflow pushes to master; a person merges the review PR to deploy.
    if: github.ref == 'refs/heads/master' && needs.gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout current master for the allowlisted publish
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          # Full history so the review-branch merge base with master is always
          # computable without guessing.
          fetch-depth: 0

      - name: Refuse a stale or advanced master
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          git fetch --quiet --no-tags origin master
          test "$(git rev-parse origin/master)" = "$BUILD_SHA"

      - name: Download the read-only-validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-cascade-data
          path: incoming

      # This invokes only Python standard-library code from the trusted checkout;
      # it never deserializes incoming RDS payloads or installs third-party packages.
      - name: Verify receipt and install exactly four data files
        run: |
          set -euo pipefail
          python scripts/trusted_publish.py verify-receipt "$BUILD_SHA" incoming
          install -m 0644 incoming/data/cascade.rds data/cascade.rds
          install -m 0644 incoming/data/search_index.rds data/search_index.rds
          install -m 0644 incoming/data/cascade_meta.rds data/cascade_meta.rds
          install -m 0644 incoming/data/neon-cascade-codebook.csv data/neon-cascade-codebook.csv

      - name: Refresh checksums without changing the validated package graph
        run: |
          set -euo pipefail
          python scripts/trusted_publish.py update-manifest manifest.json
          python scripts/trusted_publish.py verify-manifest manifest.json
          cmp -s incoming/data/cascade.rds data/cascade.rds
          cmp -s incoming/data/search_index.rds data/search_index.rds
          cmp -s incoming/data/cascade_meta.rds data/cascade_meta.rds
          cmp -s incoming/data/neon-cascade-codebook.csv data/neon-cascade-codebook.csv
          python scripts/trusted_publish.py verify-receipt "$BUILD_SHA" incoming
          rm -rf -- incoming

      - name: Publish or update the review branch (never master)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_paths='^(data/cascade[.]rds|data/search_index[.]rds|data/cascade_meta[.]rds|data/neon-cascade-codebook[.]csv|manifest[.]json)$'
          test -z "$(git ls-files --others --exclude-standard)"
          while IFS= read -r path; do
            case "$path" in
              data/cascade.rds|data/search_index.rds|data/cascade_meta.rds|data/neon-cascade-codebook.csv|manifest.json) ;;
              *) echo "Unexpected publisher change: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          if git diff --quiet -- data/cascade.rds data/search_index.rds data/cascade_meta.rds data/neon-cascade-codebook.csv manifest.json; then
            echo "No artifact change; no review branch proposed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --quiet --no-tags origin master
          remote_master=$(git rev-parse origin/master)
          if [ "$remote_master" != "$BUILD_SHA" ]; then
            echo "::error title=Stale refresh base::master moved from $BUILD_SHA to $remote_master; rebuild the candidate."
            exit 1
          fi
          branch="automation/atlas-data-refresh"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          if [ -n "$remote_head" ]; then
            git fetch --no-tags origin \
              "refs/heads/$branch:refs/remotes/origin/$branch"
            merge_base=$(git merge-base origin/master "refs/remotes/origin/$branch" || true)
            if [ -z "$merge_base" ]; then
              git fetch --no-tags --deepen=200 origin master "$branch"
              merge_base=$(git merge-base origin/master "refs/remotes/origin/$branch" || true)
            fi
            if [ -z "$merge_base" ]; then
              echo "::error title=Refresh review history unavailable::could not establish the existing review branch base without risking an overwrite"
              exit 1
            fi
            human_review_paths=$(git diff --name-only "$merge_base" \
              "refs/remotes/origin/$branch" | grep -Ev "$publish_paths" || true)
            if [ -n "$human_review_paths" ]; then
              pr_url=$(gh pr list --head "$branch" --base master --state open --json url --jq '.[0].url // ""')
              notice="A newer validated candidate is available from ${run_url}, but automation did not overwrite the active human review changes: ${human_review_paths//$'\n'/, }."
              if [ -n "$pr_url" ]; then gh pr comment "$pr_url" --body "$notice"; fi
              echo "::notice title=Human refresh review preserved::$notice"
              exit 0
            fi
          fi
          git switch -C "$branch"
          git config user.name "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git add -- data/cascade.rds data/search_index.rds data/cascade_meta.rds data/neon-cascade-codebook.csv manifest.json
          if git diff --cached --quiet; then
            echo "No artifact change after staging; no review branch proposed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "data: propose validated response-atlas rebuild [bot]" \
                     -m "Source ${BUILD_SHA}; validator run ${run_url}. Four data files passed the SHA-256 receipt, the read-only contract job, and the stdlib publisher checks; manifest.json checksums were refreshed without changing the reviewed package graph."
          published_commit=$(git rev-parse HEAD)
          if [ "$(git rev-parse HEAD^)" != "$BUILD_SHA" ]; then
            echo "::error title=Candidate identity mismatch::promotion commit is not a direct child of the exact validated master revision"
            exit 1
          fi
          if [ -n "$remote_head" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_head" origin "$branch:refs/heads/$branch"
          else
            git push origin "$branch:refs/heads/$branch"
          fi
          pushed_commit=""
          for _ in 1 2 3 4 5; do
            pushed_commit=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            [ "$pushed_commit" = "$published_commit" ] && break
            sleep 2
          done
          if [ "$pushed_commit" != "$published_commit" ]; then
            echo "::error title=Published branch identity mismatch::review branch does not resolve to the validated candidate commit"
            exit 1
          fi

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${branch}?expand=1"
          body="Validated Cross-Product Response Atlas candidate from ${run_url}, built from master ${BUILD_SHA}. Merging this PR to master is the explicit production deploy decision; post-deploy.yml then verifies the live app."
          pr_count=$(gh pr list --head "$branch" --base master --state open \
            --json url --jq 'length')
          if [ "$pr_count" -gt 1 ]; then
            echo "::error title=Ambiguous refresh review::more than one open master PR exists for $branch"
            exit 1
          fi
          if [ "$pr_count" -eq 0 ]; then
            {
              echo "### Validated Cross-Product Response Atlas review branch ready"
              echo "- Branch: ${branch}"
              echo "- Exact head: ${published_commit}"
              echo "- Source commit: ${BUILD_SHA}"
              echo "- Validator run: ${run_url}"
              echo "- [Open the review PR](${compare_url})"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Validated review branch ready::Open a PR from $branch to master at ${compare_url} after reviewing run ${GITHUB_RUN_ID}; that pull_request event is the exact-head CI trigger. $body Exact candidate head: $published_commit."
            exit 0
          fi

          pr_record=""
          for _ in 1 2 3 4 5; do
            pr_record=$(gh pr list --head "$branch" --base master --state open \
              --json url,baseRefName,headRefName,headRefOid \
              --jq 'if length == 1 then .[0] | [.url,.baseRefName,.headRefName,.headRefOid] | @tsv else "" end')
            case "$pr_record" in
              *$'\t'"$published_commit") break ;;
            esac
            sleep 2
          done
          IFS=$'\t' read -r pr_url pr_base pr_head pr_oid <<< "$pr_record"
          if [ -z "$pr_record" ] || [ "$pr_base" != master ] || \
             [ "$pr_head" != "$branch" ] || [ "$pr_oid" != "$published_commit" ]; then
            echo "::error title=Refresh PR identity mismatch::open PR does not match master <- $branch at the exact validated head"
            exit 1
          fi
          gh pr comment "$pr_url" --body "$body Exact candidate head: ${published_commit}. GitHub will hold the pull_request synchronize checks triggered by this automation update for approval; a repository write user must select **Approve workflows to run**. Do not merge until checks are green on exact head ${published_commit}."
          {
            echo "### Cross-Product Response Atlas review PR updated"
            echo "- PR: ${pr_url}"
            echo "- Exact head: ${published_commit}"
            echo "- Validator run: ${run_url}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Approve exact-head review checks::Existing PR updated to $published_commit. A repository write user must approve workflows and verify green checks on that exact head before merging; the merge to master is the deploy. Compare: ${compare_url}"
