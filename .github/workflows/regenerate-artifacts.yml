name: Regenerate artifact family for promotion

# Produces a byte-conforming artifact family from ANY branch and uploads it for
# review and manual promotion. It exists because a build-code change necessarily
# rewrites the recorded build lineage, so `rebuild-contracts` can never go green
# on a source-only head: the family has to be regenerated by a builder whose
# bytes match this CI runner, and only then re-registered.
#
# Deliberately read-only. `permissions: contents: read`, no token is persisted,
# nothing is committed, pushed, or deployed; the regenerated family leaves only
# as a workflow artifact. Promotion stays a reviewed human/agent step.
#
# It mirrors ci.yml's `rebuild-contracts` runtime exactly (same runner, R
# version, dependency pins, OpenBLAS kernel and thread width) with two
# deliberate omissions:
#   * the `source("global.R")` boot-integrity guard, which fails by design on the
#     head being regenerated — that failure is the reason this workflow exists;
#   * the byte-reproduction gate, because the bytes are expected to move.
# Every other contract still runs inside `scripts/rebuild_all.R`, which fails
# closed on any scientific, provenance, or manifest violation.

on:
  workflow_dispatch:
    inputs:
      siblings:
        description: "Sibling data to build against: 'pinned' reproduces the recorded source lock (lineage-only change, values must not move); 'current' fetches each sibling's default branch (adopts upstream data)."
        type: choice
        options: [pinned, current]
        default: pinned

permissions:
  contents: read

concurrency:
  group: cascade-regenerate-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  RSPM: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout the literal requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert the literal requested revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Install build and runtime dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: shiny, bslib@0.11.0, bsicons, dplyr, plotly@4.12.0, htmltools, htmlwidgets, shinyjs, shinycssloaders, DT, tidyr, stringr, tibble, metafor, rsconnect, jsonlite, cpp11
          pak-version: stable
          dependencies: '"hard"'
          cache-version: cascade-ppm-2026-07-15-v2
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Verify the deterministic OpenBLAS runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes

          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          lib.openblas_get_config.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          config = lib.openblas_get_config().decode("ascii")
          print(f"OpenBLAS core={core} threads={threads} config={config}")
          if core.lower() != "haswell":
              raise SystemExit(f"expected OpenBLAS Haswell core, got {core!r}")
          if threads != 1:
              raise SystemExit(f"expected one OpenBLAS thread, got {threads}")
          PY

      # Reads the committed artifact's own recorded provenance. This does not boot
      # the application, so it works on a head whose build lineage has moved.
      - name: Extract the immutable source lock from the committed artifact
        env:
          CASCADE_ROOT: ""
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/workflow_guard.R source-lock data/cascade.rds "$RUNNER_TEMP/source-lock.tsv"
          test "$(wc -l < "$RUNNER_TEMP/source-lock.tsv")" -eq 7
          cp -- data/cascade.rds "$RUNNER_TEMP/cascade-baseline.rds"
          cp -- manifest.json "$RUNNER_TEMP/manifest-baseline.json"

      - name: Fetch the seven siblings under the selected policy
        run: |
          set -euo pipefail
          ws="$RUNNER_TEMP/siblings"
          mkdir -p "$ws"
          while IFS=$'\t' read -r product directory origin commit; do
            test -n "$product" && test -n "$directory"
            test "${origin#github.com/tgilbert14/}" != "$origin"
            repo="$ws/$directory"
            git init -q "$repo"
            git -C "$repo" remote add origin "https://${origin}.git"
            if [ "${{ inputs.siblings }}" = "pinned" ]; then
              git -C "$repo" fetch --quiet --no-tags --depth=1 origin "$commit"
              test "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$commit"
            else
              git -C "$repo" fetch --quiet --no-tags --depth=1 origin HEAD
            fi
            git -C "$repo" -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
            git -C "$repo" diff --quiet --ignore-space-at-eol -- .
            git -C "$repo" diff --cached --quiet -- .
            echo "$directory $(git -C "$repo" rev-parse HEAD)"
          done < "$RUNNER_TEMP/source-lock.tsv"
          test "$(find "$ws" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 7
          echo "CASCADE_ROOT=$ws" >> "$GITHUB_ENV"

      - name: Regenerate every artifact and run the full contract suite
        run: Rscript --vanilla scripts/rebuild_all.R

      - name: Report what moved
        run: |
          set -euo pipefail
          {
            echo "## Regenerated artifact family"
            echo
            echo "Siblings: \`${{ inputs.siblings }}\` · source \`$SOURCE_SHA\`"
            echo
            echo "### Canonical SHA-256 to register"
            echo
            echo '```'
            sha256sum data/cascade.rds data/search_index.rds data/cascade_meta.rds \
                      data/neon-cascade-codebook.csv manifest.json
            echo '```'
            echo
            echo "### Files changed against the committed tree"
            echo
            echo '```'
            git status --porcelain=v1 -- data/ manifest.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          Rscript --vanilla scripts/report_mosq_effort_delta.R \
            "$RUNNER_TEMP/cascade-baseline.rds" data/cascade.rds "$GITHUB_STEP_SUMMARY"

      - name: Stage the family and a SHA-256 receipt
        run: |
          set -euo pipefail
          test ! -e outgoing
          mkdir -p outgoing/data
          install -m 0644 data/cascade.rds outgoing/data/cascade.rds
          install -m 0644 data/search_index.rds outgoing/data/search_index.rds
          install -m 0644 data/cascade_meta.rds outgoing/data/cascade_meta.rds
          install -m 0644 data/neon-cascade-codebook.csv outgoing/data/neon-cascade-codebook.csv
          install -m 0644 manifest.json outgoing/manifest.json
          ( cd outgoing && sha256sum data/* manifest.json > artifact-receipt.tsv )
          cat outgoing/artifact-receipt.tsv

      - name: Upload the regenerated family for reviewed promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-regenerated-${{ inputs.siblings }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: outgoing/
