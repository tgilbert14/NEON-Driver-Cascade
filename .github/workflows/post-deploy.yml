name: Verify Cross-Product Response Atlas production

# Every push to master is a Connect Cloud deploy (a person merging the refresh
# review PR included). This job waits for the cover and the live app, drives the
# app in headless Chromium, and requires the About tab's "Snapshot and
# provenance" fold to show the exact built_when of the bundle just pushed. A
# failure opens or updates one outage issue; the next healthy run closes it.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-production-health
  cancel-in-progress: true

jobs:
  semantic_health:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      # Base R only: readRDS needs no package to reach a character field.
      - name: Read the pushed bundle's built_when
        id: bundle
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # the $ signs are R list access, not shell
          built_when=$(Rscript --vanilla -e 'cat(readRDS("data/cascade.rds")$meta$built_when)')
          if [[ ! "$built_when" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{2}:[0-9]{2}:[0-9]{2}\ UTC$ ]]; then
            echo "::error title=Unreadable bundle timestamp::data/cascade.rds meta\$built_when is '$built_when', not a UTC timestamp"
            exit 1
          fi
          echo "built_when=$built_when" >> "$GITHUB_OUTPUT"
          echo "Expected live built_when: $built_when" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for Connect Cloud and verify the live snapshot
        env:
          SMOKE_BUILT_WHEN: ${{ steps.bundle.outputs.built_when }}
          SMOKE_BROWSER: "1"
          SMOKE_MAX_ATTEMPTS: "12"
          SMOKE_SLEEP_BASE: "10"
          SMOKE_BROWSER_TIMEOUT: "150"
          SMOKE_TOTAL_DEADLINE: "900"
        run: |
          set -euo pipefail
          sleep 45
          bash scripts/post_deploy_smoke.sh \
            "GitHub Pages cover=https://tgilbert14.github.io/NEON-Driver-Cascade/" \
            "Connect Cloud app=https://019ee1cf-a484-44eb-a181-cd495df24b3b.share.connect.posit.cloud/"

      - name: Open or update the production outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Production health: Cross-Product Response Atlas smoke failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // ""')
          body="Master ${GITHUB_SHA} did not pass the post-deploy smoke (cover, live app, and About-tab built_when) within the cold-start budget. Run: ${run_url}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a resolved production outage issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Production health: Cross-Product Response Atlas smoke failed"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$number" --comment "Production health recovered at ${GITHUB_SHA}. Evidence: ${run_url}"
          fi
