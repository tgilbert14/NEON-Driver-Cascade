name: Validate cascade build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cascade-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pull-request `github.sha` is GitHub's synthetic merge ref. Scientific PR
  # evidence must instead execute the literal submitted head; push runs retain
  # the immutable commit that triggered the workflow.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  RSPM: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15
  # Hosted x64 runners can select different OpenBLAS kernels from their physical
  # CPU. Pin both the kernel family and reduction width for release-byte builds.
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  rebuild-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout the immutable cascade revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert the literal requested revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Install build and runtime dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: shiny, bslib@0.11.0, bsicons, dplyr, plotly@4.12.0, htmltools, htmlwidgets, shinyjs, shinycssloaders, DT, tidyr, stringr, tibble, metafor, rsconnect, jsonlite, cpp11
          pak-version: stable
          dependencies: '"hard"'
          cache-version: cascade-ppm-2026-07-15-v2
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Verify the deterministic OpenBLAS runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes

          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          lib.openblas_get_config.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          config = lib.openblas_get_config().decode("ascii")
          print(f"OpenBLAS core={core} threads={threads} config={config}")
          if core.lower() != "haswell":
              raise SystemExit(f"expected OpenBLAS Haswell core, got {core!r}")
          if threads != 1:
              raise SystemExit(f"expected one OpenBLAS thread, got {threads}")
          PY

      # This must precede every sibling clone. It validates the deploy snapshot and
      # emits a seven-row, allowlisted origin/commit lock from committed provenance.
      - name: Validate committed snapshot and extract immutable source lock
        env:
          CASCADE_ROOT: ""
        run: |
          set -euo pipefail
          Rscript --vanilla -e 'for (f in c("global.R","ui.R","server.R","R/cascade_helpers.R","R/site_metadata.R")) parse(f); source("global.R"); source("ui.R"); source("server.R")'
          node --check www/cascade.js
          PYTHONDONTWRITEBYTECODE=1 python scripts/test_trusted_publish.py
          Rscript --vanilla scripts/workflow_guard.R self-test
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/test_suite_synthesis.R
          Rscript --vanilla scripts/verify_manifest.R
          Rscript --vanilla scripts/test_manifest_compare.R
          Rscript --vanilla scripts/workflow_guard.R source-lock data/cascade.rds "$RUNNER_TEMP/source-lock.tsv"
          test "$(wc -l < "$RUNNER_TEMP/source-lock.tsv")" -eq 7

      - name: Capture the validated baseline manifest
        run: cp -- manifest.json "$RUNNER_TEMP/manifest-baseline.json"

      - name: Fetch the seven recorded sibling commits detached
        run: |
          set -euo pipefail
          ws="$RUNNER_TEMP/siblings"
          mkdir -p "$ws"
          while IFS=$'\t' read -r product directory origin commit; do
            test -n "$product" && test -n "$directory"
            test "${origin#github.com/tgilbert14/}" != "$origin"
            repo="$ws/$directory"
            git init -q "$repo"
            git -C "$repo" remote add origin "https://${origin}.git"
            git -C "$repo" fetch --quiet --no-tags --depth=1 origin "$commit"
            test "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$commit"
            git -C "$repo" -c advice.detachedHead=false checkout --quiet --detach "$commit"
            test "$(git -C "$repo" rev-parse HEAD)" = "$commit"
            git -C "$repo" diff --quiet --ignore-space-at-eol -- .
            git -C "$repo" diff --cached --quiet -- .
          done < "$RUNNER_TEMP/source-lock.tsv"
          test "$(find "$ws" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 7
          echo "CASCADE_ROOT=$ws" >> "$GITHUB_ENV"

      - name: Rebuild every artifact and run contracts
        run: Rscript --vanilla scripts/rebuild_all.R

      - name: Require committed scientific artifacts to reproduce exactly
        run: git diff --exit-code -- data/cascade.rds data/search_index.rds data/cascade_meta.rds data/neon-cascade-codebook.csv

      - name: Require the deploy manifest to reproduce semantically
        run: Rscript --vanilla scripts/compare_manifests.R "$RUNNER_TEMP/manifest-baseline.json" manifest.json

      - name: Reject whitespace errors
        run: git diff --check

  discharge-feasibility-f0-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the literal Discharge F0 revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/discharge_feasibility_contract.R
            scripts/test_discharge_feasibility_contract.R
          sparse-checkout-cone-mode: false

      - name: Assert the literal requested revision and synthetic-only surface
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          expected="$RUNNER_TEMP/discharge-f0-sparse-expected.txt"
          actual="$RUNNER_TEMP/discharge-f0-sparse-actual.txt"
          printf '%s\n' \
            scripts/discharge_feasibility_contract.R \
            scripts/test_discharge_feasibility_contract.R > "$expected"
          find . -path './.git' -prune -o -type f -printf '%P\n' |
            LC_ALL=C sort > "$actual"
          cmp -s "$expected" "$actual"
          test -z "$(find . -path './.git' -prune -o -type l -print -quit)"
          rm -f -- "$expected" "$actual"
          test -z "$(git config --local --get-regexp '^http[.].*[.]extraheader$' || true)"
          git remote remove origin
          test -z "$(git remote)"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Freeze the synthetic execution surface
        run: |
          set -euo pipefail
          child_tmp="$RUNNER_TEMP/discharge-f0-synthetic-child-tmp"
          baseline="$RUNNER_TEMP/discharge-f0-synthetic-before.tsv"
          test ! -e "$child_tmp"
          install -d -m 0700 "$child_tmp"
          test -O "$child_tmp"
          test "$(stat -c '%a' "$child_tmp")" = 700

          capture_inventory() {
            output="$1"
            {
              find . -path './.git' -prune -o \
                -printf 'entry\t%y\t%m\t%P\n' | LC_ALL=C sort
              find . -path './.git' -prune -o -type f -print0 |
                LC_ALL=C sort -z |
                while IFS= read -r -d '' path; do
                  printf 'sha256\t%s\t' "${path#./}"
                  sha256sum "$path" | awk '{print $1}'
                done
            } > "$output"
          }
          capture_inventory "$baseline"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          untracked="$(git ls-files --others --exclude-standard)"
          porcelain="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$untracked"
          test -z "$porcelain"

      - name: Run the synthetic contract in a verified empty network namespace
        run: |
          set -euo pipefail
          child_tmp="$RUNNER_TEMP/discharge-f0-synthetic-child-tmp"
          test "$child_tmp" = "$RUNNER_TEMP/discharge-f0-synthetic-child-tmp"
          test -d "$child_tmp"
          test -O "$child_tmp"
          test "$(stat -c '%a' "$child_tmp")" = 700
          host_net="$(readlink /proc/self/ns/net)"
          test -n "$host_net"

          sudo unshare --net -- env -i \
            PATH="$PATH" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            TMPDIR="$child_tmp" \
            TMP_OWNER_UID="$(id -u)" \
            HOST_NET="$host_net" \
            bash --noprofile --norc -c '
              set -euo pipefail
              child_net="$(readlink /proc/self/ns/net)"
              test -n "$child_net"
              test "$child_net" != "$HOST_NET"
              ipv4_routes="$(ip -o route show table all)"
              ipv6_routes="$(ip -o -6 route show table all)"
              test -z "$ipv4_routes"
              test -z "$ipv6_routes"
              test -d "$TMPDIR"
              test "$(stat -c "%u" "$TMPDIR")" = "$TMP_OWNER_UID"
              test "$(stat -c "%a" "$TMPDIR")" = 700
              Rscript --vanilla \
                scripts/test_discharge_feasibility_contract.R
            '

      - name: Reassert the synthetic surface and destroy owned temporary state
        if: always()
        run: |
          set -euo pipefail
          child_tmp="$RUNNER_TEMP/discharge-f0-synthetic-child-tmp"
          baseline="$RUNNER_TEMP/discharge-f0-synthetic-before.tsv"
          after="$RUNNER_TEMP/discharge-f0-synthetic-after.tsv"
          test "$child_tmp" = "$RUNNER_TEMP/discharge-f0-synthetic-child-tmp"
          cleanup() {
            sudo rm -rf -- "$child_tmp"
            rm -f -- "$baseline" "$after"
          }
          trap cleanup EXIT
          test -f "$baseline"
          {
            find . -path './.git' -prune -o \
              -printf 'entry\t%y\t%m\t%P\n' | LC_ALL=C sort
            find . -path './.git' -prune -o -type f -print0 |
              LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                printf 'sha256\t%s\t' "${path#./}"
                sha256sum "$path" | awk '{print $1}'
              done
          } > "$after"
          cmp -s "$baseline" "$after"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          untracked="$(git ls-files --others --exclude-standard)"
          porcelain="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$untracked"
          test -z "$porcelain"

  discharge-feasibility-f1-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the literal Discharge F1 offline surface
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/ci.yml
            .github/workflows/discharge-f1-inventory.yml
            docs/DISCHARGE-FEASIBILITY-SPEC.md
            docs/receipts/discharge-inverts-response-site-years.tsv
            docs/receipts/discharge-f1-release-receipt.json
            docs/receipts/discharge-f1-file-inventory.tsv
            docs/receipts/discharge-f1-schema-inventory.tsv
            docs/receipts/discharge-f2-file-allowlist.tsv
            data/cascade.rds
            data/search_index.rds
            data/cascade_meta.rds
            data/neon-cascade-codebook.csv
            manifest.json
            scripts/discharge_f1_contract.py
            scripts/discharge_f1_acquire.py
            scripts/verify_discharge_f1_inventory.py
            scripts/test_discharge_f1_contract.py
          sparse-checkout-cone-mode: false

      - name: Assert the literal revision and exact offline surface
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          expected="$RUNNER_TEMP/discharge-f1-offline-expected.txt"
          actual="$RUNNER_TEMP/discharge-f1-offline-actual.txt"
          printf '%s\n' \
            .github/workflows/ci.yml \
            .github/workflows/discharge-f1-inventory.yml \
            data/cascade.rds \
            data/cascade_meta.rds \
            data/neon-cascade-codebook.csv \
            data/search_index.rds \
            docs/DISCHARGE-FEASIBILITY-SPEC.md \
            docs/receipts/discharge-inverts-response-site-years.tsv \
            manifest.json \
            scripts/discharge_f1_acquire.py \
            scripts/discharge_f1_contract.py \
            scripts/test_discharge_f1_contract.py \
            scripts/verify_discharge_f1_inventory.py > "$expected"
          receipts=(
            docs/receipts/discharge-f1-release-receipt.json
            docs/receipts/discharge-f1-file-inventory.tsv
            docs/receipts/discharge-f1-schema-inventory.tsv
            docs/receipts/discharge-f2-file-allowlist.tsv
          )
          present=0
          for receipt in "${receipts[@]}"; do
            if test -e "$receipt"; then
              test -f "$receipt"
              test ! -L "$receipt"
              printf '%s\n' "$receipt" >> "$expected"
              present=$((present + 1))
            fi
          done
          test "$present" -eq 0 || test "$present" -eq 4
          LC_ALL=C sort -o "$expected" "$expected"
          find . -path './.git' -prune -o -type f -printf '%P\n' |
            LC_ALL=C sort > "$actual"
          cmp -s "$expected" "$actual"
          test -z "$(find . -path './.git' -prune -o -type l -print -quit)"
          rm -f -- "$expected" "$actual"
          test -z "$(git config --local --get-regexp '^http[.].*[.]extraheader$' || true)"
          git remote remove origin
          test -z "$(git remote)"

      - name: Freeze the F1 offline execution surface
        run: |
          set -euo pipefail
          child_tmp="$RUNNER_TEMP/discharge-f1-offline-child-tmp"
          baseline="$RUNNER_TEMP/discharge-f1-offline-before.tsv"
          test ! -e "$child_tmp"
          install -d -m 0700 "$child_tmp"
          test -O "$child_tmp"
          test "$(stat -c '%a' "$child_tmp")" = 700
          {
            find . -path './.git' -prune -o \
              -printf 'entry\t%y\t%m\t%P\n' | LC_ALL=C sort
            find . -path './.git' -prune -o -type f -print0 |
              LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                printf 'sha256\t%s\t' "${path#./}"
                sha256sum "$path" | awk '{print $1}'
              done
          } > "$baseline"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run the F1 adversarial family without network
        run: |
          set -euo pipefail
          child_tmp="$RUNNER_TEMP/discharge-f1-offline-child-tmp"
          test "$child_tmp" = "$RUNNER_TEMP/discharge-f1-offline-child-tmp"
          test -d "$child_tmp"
          test -O "$child_tmp"
          test "$(stat -c '%a' "$child_tmp")" = 700
          host_net="$(readlink /proc/self/ns/net)"
          test -n "$host_net"
          runner_user="$(id -un)"
          test -n "$runner_user"

          sudo unshare --net -- sudo -u "$runner_user" env -i \
            PATH="$PATH" \
            HOME="$child_tmp" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            TMPDIR="$child_tmp" \
            PYTHONDONTWRITEBYTECODE=1 \
            HOST_NET="$host_net" \
            bash --noprofile --norc -c '
              set -euo pipefail
              child_net="$(readlink /proc/self/ns/net)"
              test -n "$child_net"
              test "$child_net" != "$HOST_NET"
              test -z "$(ip -o route show table all)"
              test -z "$(ip -o -6 route show table all)"
              test -d "$TMPDIR"
              test "$(stat -c "%u" "$TMPDIR")" = "$(id -u)"
              test "$(stat -c "%a" "$TMPDIR")" = 700
              python3 -B scripts/test_discharge_f1_contract.py
              receipts=(
                docs/receipts/discharge-f1-release-receipt.json
                docs/receipts/discharge-f1-file-inventory.tsv
                docs/receipts/discharge-f1-schema-inventory.tsv
                docs/receipts/discharge-f2-file-allowlist.tsv
              )
              present=0
              for receipt in "${receipts[@]}"; do
                test ! -e "$receipt" || present=$((present + 1))
              done
              if test "$present" -eq 4; then
                published_receipts="$TMPDIR/published-receipts"
                test ! -e "$published_receipts"
                install -d -m 0700 "$published_receipts"
                for receipt in "${receipts[@]}"; do
                  install -m 0644 "$receipt" "$published_receipts/$(basename "$receipt")"
                done
                python3 -B scripts/verify_discharge_f1_inventory.py "$published_receipts"
              else
                test "$present" -eq 0
              fi
            '

      - name: Bind any F1 receipt family to its direct-child producer
        run: |
          set -euo pipefail
          receipts=(
            docs/receipts/discharge-f1-release-receipt.json
            docs/receipts/discharge-f1-file-inventory.tsv
            docs/receipts/discharge-f1-schema-inventory.tsv
            docs/receipts/discharge-f2-file-allowlist.tsv
          )
          present=0
          for receipt in "${receipts[@]}"; do
            test ! -e "$receipt" || present=$((present + 1))
          done
          test "$present" -eq 0 || test "$present" -eq 4
          if test "$present" -eq 0; then
            exit 0
          fi

          receipt_source="$(python3 -B -c \
            'import json, pathlib, re, sys; value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="ascii"))["source_sha"]; sys.stdout.write(value if isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value) else "")' \
            "${receipts[0]}")"
          [[ "$receipt_source" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$receipt_source^{commit}"
          git merge-base --is-ancestor "$receipt_source" HEAD

          expected_changes="$(printf '%s\n' "${receipts[@]}" | LC_ALL=C sort)"
          producer_commit=
          producer_count=0
          while IFS= read -r commit; do
            read -r -a parents <<< "$(git show -s --format='%P' "$commit")"
            test "${#parents[@]}" -eq 1 || continue
            test "${parents[0]}" = "$receipt_source" || continue
            actual_changes="$(git diff-tree --no-commit-id --name-only -r \
              "$commit" | LC_ALL=C sort)"
            test "$actual_changes" = "$expected_changes" || continue
            blobs_match=1
            for receipt in "${receipts[@]}"; do
              if test "$(git rev-parse "$commit:$receipt")" != \
                "$(git rev-parse "HEAD:$receipt")"; then
                blobs_match=0
                break
              fi
            done
            test "$blobs_match" -eq 1 || continue
            producer_commit="$commit"
            producer_count=$((producer_count + 1))
          done < <(git rev-list "$receipt_source..HEAD")
          test "$producer_count" -eq 1
          test -n "$producer_commit"

          if test "$GITHUB_EVENT_NAME" = pull_request; then
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$PR_BASE_SHA^{commit}"
            if ! git merge-base --is-ancestor "$producer_commit" \
              "$PR_BASE_SHA"; then
              test "$producer_commit" = "$SOURCE_SHA"
              [[ "$GITHUB_HEAD_REF" =~ ^automation/discharge-f1-[0-9]+-[0-9]+$ ]]
            fi
          fi

      - name: Reassert the F1 surface and destroy owned temporary state
        if: always()
        run: |
          set -euo pipefail
          child_tmp="$RUNNER_TEMP/discharge-f1-offline-child-tmp"
          baseline="$RUNNER_TEMP/discharge-f1-offline-before.tsv"
          after="$RUNNER_TEMP/discharge-f1-offline-after.tsv"
          test "$child_tmp" = "$RUNNER_TEMP/discharge-f1-offline-child-tmp"
          cleanup() {
            sudo rm -rf -- "$child_tmp"
            rm -f -- "$baseline" "$after"
          }
          trap cleanup EXIT
          test -f "$baseline"
          {
            find . -path './.git' -prune -o \
              -printf 'entry\t%y\t%m\t%P\n' | LC_ALL=C sort
            find . -path './.git' -prune -o -type f -print0 |
              LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                printf 'sha256\t%s\t' "${path#./}"
                sha256sum "$path" | awk '{print $1}'
              done
          } > "$after"
          cmp -s "$baseline" "$after"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  discharge-feasibility-f0-inverts-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      INVERTS_AUTHORITY: ff23e994e289982c747b91e48c5ff0907c1672d2
    steps:
      - name: Checkout only the literal values-free Inverts authority surface
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            docs/receipts/discharge-inverts-response-site-years.tsv
            scripts/discharge_feasibility_contract.R
            scripts/test_discharge_inverts_authority.R
          sparse-checkout-cone-mode: false

      - name: Assert the literal requested revision and restricted surface
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INVERTS_AUTHORITY" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          expected="$RUNNER_TEMP/discharge-f0-authority-sparse-expected.txt"
          actual="$RUNNER_TEMP/discharge-f0-authority-sparse-actual.txt"
          printf '%s\n' \
            docs/receipts/discharge-inverts-response-site-years.tsv \
            scripts/discharge_feasibility_contract.R \
            scripts/test_discharge_inverts_authority.R > "$expected"
          find . -path './.git' -prune -o -type f -printf '%P\n' |
            LC_ALL=C sort > "$actual"
          cmp -s "$expected" "$actual"
          test -z "$(find . -path './.git' -prune -o -type l -print -quit)"
          rm -f -- "$expected" "$actual"
          test -z "$(git config --local --get-regexp '^http[.].*[.]extraheader$' || true)"
          git remote remove origin
          test -z "$(git remote)"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Fetch only commit and tree metadata for the Inverts authority
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/discharge-f0-inverts-authority-metadata"
          test ! -e "$repo"
          git init -q "$repo"
          git -C "$repo" remote add origin \
            https://github.com/tgilbert14/NEON-My-Little-Inverts.git
          GIT_TERMINAL_PROMPT=0 git -C "$repo" fetch --quiet --no-tags \
            --depth=1 --filter=blob:none origin "$INVERTS_AUTHORITY"
          test "$(git -C "$repo" rev-parse 'FETCH_HEAD^{commit}')" = \
            "$INVERTS_AUTHORITY"
          test "$(git -C "$repo" rev-parse "$INVERTS_AUTHORITY^{tree}")" = \
            b09c9b54aa5b81290ab6a2dc98072421eae66b03
          test "$(git -C "$repo" rev-parse "$INVERTS_AUTHORITY:data")" = \
            812be54ac172fe2febaa5a192f90070e87e3fbf0
          test "$(git -C "$repo" rev-parse "$INVERTS_AUTHORITY:data/sites")" = \
            080534caad4eb76cdaf0b5a56704ed4e890ed16a
          object_types="$RUNNER_TEMP/discharge-f0-authority-fetch-types.txt"
          git -C "$repo" cat-file --batch-all-objects \
            --batch-check='%(objecttype)' > "$object_types"
          blob_count="$(awk '$1 == "blob" { n++ } END { print n + 0 }' \
            "$object_types")"
          test "$blob_count" -eq 0
          rm -f -- "$object_types"
          git -C "$repo" remote remove origin
          test -z "$(git -C "$repo" remote)"

      - name: Freeze the values-free authority execution surface
        run: |
          set -euo pipefail
          child_tmp="$RUNNER_TEMP/discharge-f0-authority-child-tmp"
          baseline="$RUNNER_TEMP/discharge-f0-authority-before.tsv"
          test ! -e "$child_tmp"
          install -d -m 0700 "$child_tmp"
          test -O "$child_tmp"
          test "$(stat -c '%a' "$child_tmp")" = 700
          {
            find . -path './.git' -prune -o \
              -printf 'entry\t%y\t%m\t%P\n' | LC_ALL=C sort
            find . -path './.git' -prune -o -type f -print0 |
              LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                printf 'sha256\t%s\t' "${path#./}"
                sha256sum "$path" | awk '{print $1}'
              done
          } > "$baseline"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          untracked="$(git ls-files --others --exclude-standard)"
          porcelain="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$untracked"
          test -z "$porcelain"

      - name: Verify the values-free authority in an empty network namespace
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/discharge-f0-inverts-authority-metadata"
          child_tmp="$RUNNER_TEMP/discharge-f0-authority-child-tmp"
          test "$repo" = "$RUNNER_TEMP/discharge-f0-inverts-authority-metadata"
          test "$child_tmp" = "$RUNNER_TEMP/discharge-f0-authority-child-tmp"
          test -d "$repo"
          test -d "$child_tmp"
          test -O "$child_tmp"
          test "$(stat -c '%a' "$child_tmp")" = 700
          object_types="$RUNNER_TEMP/discharge-f0-authority-pre-child-types.txt"
          git -C "$repo" cat-file --batch-all-objects \
            --batch-check='%(objecttype)' > "$object_types"
          blob_count="$(awk '$1 == "blob" { n++ } END { print n + 0 }' \
            "$object_types")"
          test "$blob_count" -eq 0
          rm -f -- "$object_types"
          host_net="$(readlink /proc/self/ns/net)"
          test -n "$host_net"

          sudo unshare --net -- env -i \
            PATH="$PATH" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            TMPDIR="$child_tmp" \
            TMP_OWNER_UID="$(id -u)" \
            HOST_NET="$host_net" \
            INVERTS_REPO="$repo" \
            GIT_NO_LAZY_FETCH=1 \
            bash --noprofile --norc -c '
              set -euo pipefail
              child_net="$(readlink /proc/self/ns/net)"
              test -n "$child_net"
              test "$child_net" != "$HOST_NET"
              ipv4_routes="$(ip -o route show table all)"
              ipv6_routes="$(ip -o -6 route show table all)"
              test -z "$ipv4_routes"
              test -z "$ipv6_routes"
              test -d "$TMPDIR"
              test "$(stat -c "%u" "$TMPDIR")" = "$TMP_OWNER_UID"
              test "$(stat -c "%a" "$TMPDIR")" = 700
              Rscript --vanilla scripts/test_discharge_inverts_authority.R \
                "$INVERTS_REPO"
            '

      - name: Reassert the authority surface and destroy temporary metadata
        if: always()
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/discharge-f0-inverts-authority-metadata"
          child_tmp="$RUNNER_TEMP/discharge-f0-authority-child-tmp"
          baseline="$RUNNER_TEMP/discharge-f0-authority-before.tsv"
          after="$RUNNER_TEMP/discharge-f0-authority-after.tsv"
          fetch_types="$RUNNER_TEMP/discharge-f0-authority-fetch-types.txt"
          pre_child_types="$RUNNER_TEMP/discharge-f0-authority-pre-child-types.txt"
          cleanup_types="$RUNNER_TEMP/discharge-f0-authority-cleanup-types.txt"
          test "$repo" = "$RUNNER_TEMP/discharge-f0-inverts-authority-metadata"
          test "$child_tmp" = "$RUNNER_TEMP/discharge-f0-authority-child-tmp"
          cleanup() {
            sudo rm -rf -- "$repo" "$child_tmp"
            rm -f -- "$baseline" "$after" "$fetch_types" \
              "$pre_child_types" "$cleanup_types"
          }
          trap cleanup EXIT
          test -f "$baseline"
          if test -d "$repo"; then
            git -C "$repo" cat-file --batch-all-objects \
              --batch-check='%(objecttype)' > "$cleanup_types"
            blob_count="$(awk '$1 == "blob" { n++ } END { print n + 0 }' \
              "$cleanup_types")"
            test "$blob_count" -eq 0
          fi
          {
            find . -path './.git' -prune -o \
              -printf 'entry\t%y\t%m\t%P\n' | LC_ALL=C sort
            find . -path './.git' -prune -o -type f -print0 |
              LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                printf 'sha256\t%s\t' "${path#./}"
                sha256sum "$path" | awk '{print $1}'
              done
          } > "$after"
          cmp -s "$baseline" "$after"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          untracked="$(git ls-files --others --exclude-standard)"
          porcelain="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$untracked"
          test -z "$porcelain"

  phenology-v2-seal2-acquire-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      receipt_sha256: ${{ steps.acquire.outputs.receipt_sha256 }}
    steps:
      - name: Checkout the literal Seal-2 revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      - name: Assert the literal requested revision
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"

      - name: Acquire only the exact legacy Phenology sites tree
        id: acquire
        env:
          PHENOLOGY_LEGACY_ORIGIN: https://github.com/tgilbert14/NEON-Plant-Phenology-Explorer.git
          PHENOLOGY_LEGACY_SHA: 81e339e9ed6f34d3d04ca45a7030fea51c4147a5
          PHENOLOGY_LEGACY_TREE: 30abe869b0f78931929c21e544ffc85ec2238e35
        run: |
          set -euo pipefail
          [[ "$PHENOLOGY_LEGACY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PHENOLOGY_LEGACY_TREE" =~ ^[0-9a-f]{40}$ ]]
          repo="$RUNNER_TEMP/phenology-v2-seal2-legacy.git"
          archive="$RUNNER_TEMP/phenology-v2-seal2-sites.tar"
          entries="$RUNNER_TEMP/phenology-v2-seal2-tree.tsv"
          payload="$RUNNER_TEMP/phenology-v2-seal2-payload"
          sites="$payload/sites"
          test ! -e "$repo"
          test ! -e "$archive"
          test ! -e "$payload"
          mkdir -p "$sites"

          git init --quiet --bare "$repo"
          git -C "$repo" remote add origin "$PHENOLOGY_LEGACY_ORIGIN"
          test "$(git -C "$repo" remote get-url origin)" = "$PHENOLOGY_LEGACY_ORIGIN"
          test "$(git -C "$repo" remote get-url --all origin | wc -l)" -eq 1
          GIT_TERMINAL_PROMPT=0 git -C "$repo" fetch --quiet --no-tags \
            --depth=1 origin "$PHENOLOGY_LEGACY_SHA"
          test "$(git -C "$repo" rev-parse 'FETCH_HEAD^{commit}')" = "$PHENOLOGY_LEGACY_SHA"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_LEGACY_SHA:data/sites")" = \
            "$PHENOLOGY_LEGACY_TREE"

          git -C "$repo" ls-tree "$PHENOLOGY_LEGACY_SHA:data/sites" > "$entries"
          awk -F '\t' '
            $1 !~ /^100644 blob [0-9a-f]{40}$/ { exit 1 }
            $2 !~ /^[A-Z0-9]{4}[.]rds$/ { exit 1 }
            END { if (NR != 46) exit 1 }
          ' "$entries"
          git -C "$repo" archive --format=tar --output="$archive" \
            "$PHENOLOGY_LEGACY_SHA:data/sites"
          tar -xf "$archive" -C "$sites"

          test "$(find "$sites" -mindepth 1 -maxdepth 1 | wc -l)" -eq 46
          test "$(find "$sites" -mindepth 1 -maxdepth 1 -type f -name '*.rds' | wc -l)" -eq 46
          test -z "$(find "$sites" -mindepth 1 -maxdepth 1 -type l -print -quit)"
          find "$sites" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
            awk '
              $0 !~ /^[A-Z0-9]{4}[.]rds$/ { exit 1 }
              END { if (NR != 46) exit 1 }
            '

          git -C "$sites" init --quiet
          git -C "$sites" config core.autocrlf false
          git -C "$sites" config core.filemode true
          git -C "$sites" add --all --force
          test "$(git -C "$sites" write-tree)" = "$PHENOLOGY_LEGACY_TREE"
          rm -rf -- "$sites/.git"
          test ! -e "$sites/.git"

          receipt="$payload/legacy-tree-receipt.tsv"
          {
            printf 'phenology-v2-seal2-legacy-tree/v1\n'
            printf 'driver_sha\t%s\n' "$SOURCE_SHA"
            printf 'origin\t%s\n' "$PHENOLOGY_LEGACY_ORIGIN"
            printf 'legacy_commit\t%s\n' "$PHENOLOGY_LEGACY_SHA"
            printf 'sites_tree\t%s\n' "$PHENOLOGY_LEGACY_TREE"
            printf 'file_count\t46\n'
          } > "$receipt"
          test "$(find "$payload" -type f | wc -l)" -eq 47
          receipt_sha="$(sha256sum "$receipt" | awk '{print $1}')"
          [[ "$receipt_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'receipt_sha256=%s\n' "$receipt_sha" >> "$GITHUB_OUTPUT"

          rm -rf -- "$repo"
          rm -f -- "$archive" "$entries"
          test ! -e "$repo"
          test ! -e "$archive"

      - name: Upload only the verified legacy sites and values-free receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phenology-v2-seal2-legacy-${{ env.SOURCE_SHA }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/phenology-v2-seal2-payload/

  phenology-v2-seal2-legacy-parity:
    needs:
      - rebuild-contracts
      - phenology-v2-seal1-synthetic
      - phenology-v2-seal2-acquire-legacy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout only the literal Seal-2 parity surface
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            R/phenology_adapter_v2.R
            scripts/test_phenology_adapter_v2_legacy.R
            docs/PHENOLOGY-V2-ADAPTER-SPEC.md
            docs/receipts/phenology-v2-seal1-runtime.json
            data/cascade.rds
            data/search_index.rds
            data/cascade_meta.rds
            data/neon-cascade-codebook.csv
            manifest.json
          sparse-checkout-cone-mode: false

      - name: Assert the literal requested revision and restricted surface
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          expected="$RUNNER_TEMP/phenology-v2-seal2-sparse-expected.txt"
          actual="$RUNNER_TEMP/phenology-v2-seal2-sparse-actual.txt"
          printf '%s\n' \
            R/phenology_adapter_v2.R \
            data/cascade.rds \
            data/cascade_meta.rds \
            data/neon-cascade-codebook.csv \
            data/search_index.rds \
            docs/PHENOLOGY-V2-ADAPTER-SPEC.md \
            docs/receipts/phenology-v2-seal1-runtime.json \
            manifest.json \
            scripts/test_phenology_adapter_v2_legacy.R > "$expected"
          find . -path './.git' -prune -o -type f -printf '%P\n' |
            LC_ALL=C sort > "$actual"
          cmp -s "$expected" "$actual"
          test -z "$(find . -path './.git' -prune -o -type l -print -quit)"
          rm -f -- "$expected" "$actual"
          test -z "$(git config --local --get-regexp '^http[.].*[.]extraheader$' || true)"
          git remote remove origin
          test -z "$(git remote)"
          for path in \
            R/phenology_adapter_v2.R \
            scripts/test_phenology_adapter_v2_legacy.R \
            docs/PHENOLOGY-V2-ADAPTER-SPEC.md \
            docs/receipts/phenology-v2-seal1-runtime.json \
            data/cascade.rds \
            data/search_index.rds \
            data/cascade_meta.rds \
            data/neon-cascade-codebook.csv \
            manifest.json; do
            test -f "$path"
          done
          for path in \
            R/phenology_response_model_v2.R \
            R/phenology_climate_support_mask_v2.R \
            R/source_adapters.R \
            scripts/build_cascade.R \
            scripts/cascade_meta.R \
            scripts/rebuild_all.R; do
            test ! -e "$path"
          done

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Install the exact sealed response and future-effect packages
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: survival@3.8-9, metafor@5.0-1
          pak-version: stable
          dependencies: '"hard"'
          cache-version: phenology-v2-seal1-ppm-2026-07-15-v1
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Verify the complete sealed runtime lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          path = Path("docs/receipts/phenology-v2-seal1-runtime.json")
          lock = json.loads(path.read_text(encoding="utf-8"))
          if lock.get("schema") != "phenology-v2-seal1-runtime-lock/v1":
              raise SystemExit("unexpected Phenology Seal-1 runtime-lock schema")
          if lock.get("registry_authority") != "61568339de3585db59e0ed73fed2d4b203a29bef":
              raise SystemExit("runtime lock does not name the merged Seal-0 authority")

          runtime = lock["runtime"]
          expected_runtime = {
              "os": "ubuntu-24.04",
              "platform": "x86_64-pc-linux-gnu",
              "r_version": "4.5.2",
              "repository": "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15",
              "renv_repository_override": "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15",
              "openblas_core": "Haswell",
              "openblas_threads": 1,
              "omp_threads": 1,
          }
          if runtime != expected_runtime:
              raise SystemExit("committed Phenology Seal-1 runtime authority drifted")
          if os.environ.get("RSPM") != runtime["repository"]:
              raise SystemExit("RSPM does not match the sealed runtime lock")
          if os.environ.get("RENV_CONFIG_REPOS_OVERRIDE") != runtime["renv_repository_override"]:
              raise SystemExit("RENV repository override does not match the sealed runtime lock")
          if os.environ.get("OPENBLAS_CORETYPE") != runtime["openblas_core"]:
              raise SystemExit("OpenBLAS core environment does not match the sealed runtime lock")
          if os.environ.get("OPENBLAS_NUM_THREADS") != str(runtime["openblas_threads"]):
              raise SystemExit("OpenBLAS thread environment does not match the sealed runtime lock")
          if os.environ.get("OMP_NUM_THREADS") != str(runtime["omp_threads"]):
              raise SystemExit("OMP thread environment does not match the sealed runtime lock")

          os_release = {}
          for line in Path("/etc/os-release").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  os_release[key] = value.strip('"')
          if os_release.get("ID") != "ubuntu" or os_release.get("VERSION_ID") != "24.04":
              raise SystemExit("runner is not the sealed Ubuntu 24.04 authority")

          r_meta = subprocess.run(
              ["Rscript", "--vanilla", "-e",
               "cat(as.character(getRversion()), R.version$platform, sep='\\n')"],
              check=True, text=True, capture_output=True).stdout.splitlines()
          if r_meta != [runtime["r_version"], runtime["platform"]]:
              raise SystemExit(f"R runtime mismatch: {r_meta!r}")

          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          lib.openblas_get_config.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          config = lib.openblas_get_config().decode("ascii")
          print(f"OpenBLAS core={core} threads={threads} config={config}")
          if core.lower() != runtime["openblas_core"].lower() or threads != runtime["openblas_threads"]:
              raise SystemExit("loaded OpenBLAS does not match the sealed runtime lock")

          direct = lock["direct_packages"]
          expected_direct = {
              "metafor": {
                  "package_ref": "metafor@5.0-1",
                  "version": "5.0-1",
                  "source_archive": "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15/src/contrib/metafor_5.0-1.tar.gz",
                  "source_archive_sha256": "953f1a43794a9d660225cad666849f1100263e5cad486fb8becc1ad32f81e73f",
              },
              "survival": {
                  "package_ref": "survival@3.8-9",
                  "version": "3.8-9",
                  "source_archive": "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15/src/contrib/survival_3.8-9.tar.gz",
                  "source_archive_sha256": "741f925dca22ef8f0aa67f798df19148ad56be3b09e8c8eea09e351ac5f99282",
              },
          }
          observed_direct = {
              row["package"]: {
                  key: row[key] for key in (
                      "package_ref", "version", "source_archive",
                      "source_archive_sha256")
              }
              for row in direct
          }
          if len(observed_direct) != len(direct) or observed_direct != expected_direct:
              raise SystemExit("direct package/archive authorities drifted")
          for package, authority in expected_direct.items():
              digest = hashlib.sha256()
              request = urllib.request.Request(
                  authority["source_archive"],
                  headers={"User-Agent": "NEON-Driver-Cascade-Seal2-CI/1"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  while chunk := response.read(1024 * 1024):
                      digest.update(chunk)
              if digest.hexdigest() != authority["source_archive_sha256"]:
                  raise SystemExit(f"{package} source archive digest mismatch")

          inventory = lock["package_inventory"]
          names = [row["package"] for row in inventory]
          if names != sorted(names, key=lambda value: value.encode("utf-8")) or len(names) != len(set(names)):
              raise SystemExit("package inventory is not unique radix order")
          canonical = "".join(
              f'{row["package"]}\t{row["version"]}\t{row["priority"]}\t{row["authority"]}\n'
              for row in inventory).encode("utf-8")
          digest = hashlib.sha256(canonical).hexdigest()
          expected_inventory_contract = {
              "roots": ["metafor", "survival"],
              "dependency_types": ["Depends", "Imports", "LinkingTo"],
              "includes_implicit_base": True,
              "excludes_installer_only_packages": True,
              "ordering": "R sort(method = 'radix') on package",
              "canonical_row": "package<TAB>version<TAB>priority<TAB>authority<LF>",
              "inventory_sha256": "b2263019cdcd50af0230c0fb69b1422ef064e55b2ecbe521bde6548cb9846f0f",
          }
          if lock["inventory_contract"] != expected_inventory_contract:
              raise SystemExit("package inventory contract drifted")
          if digest != expected_inventory_contract["inventory_sha256"]:
              raise SystemExit("package inventory digest mismatch")

          r_inventory = r'''
          args <- commandArgs(trailingOnly = TRUE)
          for (package in args) {
            description <- utils::packageDescription(package)
            priority <- description$Priority
            if (is.null(priority) || length(priority) != 1L || is.na(priority)) priority <- "none"
            fields <- vapply(c("Depends", "Imports", "LinkingTo"), function(field) {
              value <- description[[field]]
              if (is.null(value) || length(value) != 1L || is.na(value)) ""
              else gsub("[\r\n]+", " ", value)
            }, character(1L))
            cat(package, as.character(description$Version), priority,
                paste(fields, collapse = "\037"), sep = "\t")
            cat("\n")
          }
          '''
          observed_text = subprocess.run(
              ["Rscript", "--vanilla", "-e", r_inventory, *names],
              check=True, text=True, capture_output=True).stdout
          observed = {}
          hard_dependencies = set()
          for line in observed_text.splitlines():
              package, version, priority, fields = line.split("\t", 3)
              observed[package] = (version, priority)
              for field in fields.split("\x1f"):
                  for entry in field.split(","):
                      match = re.match(r"^\s*([A-Za-z][A-Za-z0-9.]*)", entry)
                      if match and match.group(1) != "R":
                          hard_dependencies.add(match.group(1))
          expected = {row["package"]: (row["version"], row["priority"])
                      for row in inventory}
          if observed != expected:
              raise SystemExit(f"installed package inventory mismatch: {observed!r}")
          missing = sorted(hard_dependencies.difference(expected))
          if missing:
              raise SystemExit(f"runtime lock omits hard dependencies: {missing!r}")
          print(f"Phenology Seal-2 runtime lock verified ({len(inventory)} packages; {digest})")
          PY

      - name: Download the exact-run legacy tree artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phenology-v2-seal2-legacy-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/phenology-v2-seal2-incoming

      - name: Verify the legacy receipt and recompute the exact tree
        env:
          PHENOLOGY_LEGACY_ORIGIN: https://github.com/tgilbert14/NEON-Plant-Phenology-Explorer.git
          PHENOLOGY_LEGACY_SHA: 81e339e9ed6f34d3d04ca45a7030fea51c4147a5
          PHENOLOGY_LEGACY_TREE: 30abe869b0f78931929c21e544ffc85ec2238e35
          EXPECTED_RECEIPT_SHA256: ${{ needs['phenology-v2-seal2-acquire-legacy'].outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          incoming="$RUNNER_TEMP/phenology-v2-seal2-incoming"
          sites="$incoming/sites"
          receipt="$incoming/legacy-tree-receipt.tsv"
          expected="$RUNNER_TEMP/phenology-v2-seal2-expected-receipt.tsv"
          test -d "$sites"
          test -f "$receipt"
          [[ "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$receipt" | awk '{print $1}')" = "$EXPECTED_RECEIPT_SHA256"
          {
            printf 'phenology-v2-seal2-legacy-tree/v1\n'
            printf 'driver_sha\t%s\n' "$SOURCE_SHA"
            printf 'origin\t%s\n' "$PHENOLOGY_LEGACY_ORIGIN"
            printf 'legacy_commit\t%s\n' "$PHENOLOGY_LEGACY_SHA"
            printf 'sites_tree\t%s\n' "$PHENOLOGY_LEGACY_TREE"
            printf 'file_count\t46\n'
          } > "$expected"
          cmp -s "$expected" "$receipt"
          rm -f -- "$expected"

          test "$(find "$incoming" -type f | wc -l)" -eq 47
          test "$(find "$sites" -mindepth 1 -maxdepth 1 | wc -l)" -eq 46
          test "$(find "$sites" -mindepth 1 -maxdepth 1 -type f -name '*.rds' | wc -l)" -eq 46
          test -z "$(find "$incoming" -type l -print -quit)"
          find "$sites" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
            awk '
              $0 !~ /^[A-Z0-9]{4}[.]rds$/ { exit 1 }
              END { if (NR != 46) exit 1 }
            '
          test -z "$(find "$incoming" -name .git -print -quit)"

          git -C "$sites" init --quiet
          git -C "$sites" config core.autocrlf false
          git -C "$sites" config core.filemode true
          git -C "$sites" add --all --force
          test "$(git -C "$sites" write-tree)" = "$PHENOLOGY_LEGACY_TREE"
          rm -rf -- "$sites/.git"
          test ! -e "$sites/.git"
          chmod -R a-w "$incoming"

      - name: Run the exact legacy Seal-2 gate without network access
        env:
          PHENOLOGY_V2_LEGACY_ROOT: ${{ runner.temp }}/phenology-v2-seal2-incoming/sites
          PHENOLOGY_V2_LEGACY_COMMIT: 81e339e9ed6f34d3d04ca45a7030fea51c4147a5
          PHENOLOGY_V2_LEGACY_TREE: 30abe869b0f78931929c21e544ffc85ec2238e35
        run: |
          set -euo pipefail
          for name in \
            CASCADE_ROOT \
            PHENOLOGY_ORIGIN \
            PHENOLOGY_CURRENT_DATA \
            PHENOLOGY_CURRENT_CANDIDATE \
            PHENOLOGY_GENERATOR \
            PHENOLOGY_CURRENT_KNOWLEDGE; do
            test -z "${!name:-}"
          done
          test -d "$PHENOLOGY_V2_LEGACY_ROOT"
          test -z "$(find "$PHENOLOGY_V2_LEGACY_ROOT" -name .git -print -quit)"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          test -n "${R_LIBS_USER:-}"

          host_net="$(readlink /proc/self/ns/net)"
          child_net="$(sudo unshare --net -- readlink /proc/self/ns/net)"
          test -n "$host_net"
          test -n "$child_net"
          test "$host_net" != "$child_net"

          raw_stdout="$RUNNER_TEMP/phenology-v2-seal2-raw-stdout.json"
          raw_stderr="$RUNNER_TEMP/phenology-v2-seal2-raw-stderr.log"
          child_tmp="$RUNNER_TEMP/phenology-v2-seal2-child-tmp"
          mkdir -p "$child_tmp"
          cleanup_seal2_logs() {
            rm -f -- "$raw_stdout" "$raw_stderr"
          }
          trap cleanup_seal2_logs EXIT

          set +e
          sudo unshare --net -- env -i \
            PATH="$PATH" \
            R_LIBS_USER="${R_LIBS_USER:-}" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            TZ=UTC \
            TMPDIR="$child_tmp" \
            OPENBLAS_CORETYPE=Haswell \
            OPENBLAS_NUM_THREADS=1 \
            OMP_NUM_THREADS=1 \
            PHENOLOGY_V2_LEGACY_ROOT="$PHENOLOGY_V2_LEGACY_ROOT" \
            PHENOLOGY_V2_LEGACY_COMMIT="$PHENOLOGY_V2_LEGACY_COMMIT" \
            PHENOLOGY_V2_LEGACY_TREE="$PHENOLOGY_V2_LEGACY_TREE" \
            Rscript --vanilla scripts/test_phenology_adapter_v2_legacy.R \
            > "$raw_stdout" 2> "$raw_stderr"
          child_status=$?
          set -e
          if test "$child_status" -ne 0 || test -s "$raw_stderr"; then
            echo "Phenology Seal-2 legacy gate execution failed closed; raw child output withheld." >&2
            exit 1
          fi
          test -s "$raw_stdout"
          test "$(wc -c < "$raw_stdout")" -le 4096

          python - "$raw_stdout" <<'PY'
          import json
          import math
          import re
          import sys

          expected_status = "HOLD"
          pass_keys = [
              "schema", "status", "source_support_rows",
              "finite_compatibility_rows", "finite_compatibility_sites",
              "finite_sites_ge_6", "annual_temperature_sites_ge_6",
              "spring_temperature_sites_ge_6", "fields_compared",
              "max_abs_delta", "max_abs_additive_delta", "parity_sha256",
          ]
          hold_keys = [
              "schema", "status", "hard_failure_code", "affected_bundles",
              "bundles_checked", "parity_attempted", "current_fetched",
              "current_deserialized", "effect_module_sourced",
              "effect_function_called",
          ]

          def strict_object(pairs):
              keys = [key for key, _ in pairs]
              if len(keys) != len(set(keys)):
                  raise ValueError
              return dict(pairs)

          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  value = json.load(stream, object_pairs_hook=strict_object)
              if not isinstance(value, dict):
                  raise ValueError
              if value["schema"] != "phenology-v2-seal2-legacy-parity/v1":
                  raise ValueError
              status = value["status"]
              if status == "PASS":
                  if list(value) != pass_keys:
                      raise ValueError
                  counts = {
                      "source_support_rows": 345,
                      "finite_compatibility_rows": 269,
                      "finite_compatibility_sites": 40,
                      "finite_sites_ge_6": 31,
                      "annual_temperature_sites_ge_6": 18,
                      "spring_temperature_sites_ge_6": 18,
                      "fields_compared": 11,
                  }
                  for key, expected in counts.items():
                      observed = value[key]
                      if type(observed) is not int or observed != expected:
                          raise ValueError
                  limits = {
                      "max_abs_delta": 1e-15,
                      "max_abs_additive_delta": 1e-12,
                  }
                  for key, limit in limits.items():
                      observed = value[key]
                      if (isinstance(observed, bool) or
                          not isinstance(observed, (int, float)) or
                          not math.isfinite(observed) or
                          observed < 0 or observed > limit):
                          raise ValueError
                  digest = value["parity_sha256"]
                  if (not isinstance(digest, str) or
                      not re.fullmatch(r"[0-9a-f]{64}", digest)):
                      raise ValueError
              elif status == "HOLD":
                  if list(value) != hold_keys:
                      raise ValueError
                  if value["hard_failure_code"] != "empty_required_table":
                      raise ValueError
                  if (type(value["affected_bundles"]) is not int or
                      value["affected_bundles"] != 1 or
                      type(value["bundles_checked"]) is not int or
                      value["bundles_checked"] != 46):
                      raise ValueError
                  for key in (
                      "parity_attempted", "current_fetched",
                      "current_deserialized", "effect_module_sourced",
                      "effect_function_called",
                  ):
                      if value[key] is not False:
                          raise ValueError
              else:
                  raise ValueError
              if status != expected_status:
                  raise ValueError
          except Exception:
              raise SystemExit("Phenology Seal-2 summary validation failed closed")

          if status == "HOLD":
              print("[HOLD] Phenology Seal-2 stopped at the frozen legacy source contract")
              print("[SUMMARY] bundles=46 affected=1 code=empty_required_table parity_attempted=false")
              print(
                  "[LOCK] current_fetched=false current_deserialized=false "
                  "effect_module_sourced=false effect_function_called=false"
              )
          else:
              print("[PASS] Phenology Seal-2 exact legacy parity")
              print(
                  "[SUMMARY] rows=345 finite=269 sites=40 sites_ge_6=31 "
                  "annual_temp_ge_6=18 spring_temp_ge_6=18 fields=11"
              )
              print(
                  f"[DELTA] ordinary={value['max_abs_delta']:.17g} "
                  f"additive={value['max_abs_additive_delta']:.17g}"
              )
              print(f"[RECEIPT] parity-sha256 {value['parity_sha256']}")
          PY

      - name: Reassert exact head, clean trees, and canonical artifact hashes
        env:
          PHENOLOGY_LEGACY_TREE: 30abe869b0f78931929c21e544ffc85ec2238e35
          EXPECTED_RECEIPT_SHA256: ${{ needs['phenology-v2-seal2-acquire-legacy'].outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          incoming="$RUNNER_TEMP/phenology-v2-seal2-incoming"
          sites="$incoming/sites"
          receipt="$incoming/legacy-tree-receipt.tsv"
          [[ "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$receipt" | awk '{print $1}')" = "$EXPECTED_RECEIPT_SHA256"
          test "$(find "$sites" -mindepth 1 -maxdepth 1 | wc -l)" -eq 46
          test "$(find "$sites" -mindepth 1 -maxdepth 1 -type f -name '*.rds' | wc -l)" -eq 46
          test -z "$(find "$incoming" -type l -print -quit)"
          test -z "$(find "$incoming" -name .git -print -quit)"
          chmod u+w "$sites"
          git -C "$sites" init --quiet
          git -C "$sites" config core.autocrlf false
          git -C "$sites" config core.filemode true
          git -C "$sites" add --all --force
          test "$(git -C "$sites" write-tree)" = "$PHENOLOGY_LEGACY_TREE"
          rm -rf -- "$sites/.git"
          chmod u-w "$sites"
          test ! -e "$sites/.git"

          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          test -z "$(git remote)"
          git diff --quiet -- .
          git diff --cached --quiet -- .
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(sha256sum data/cascade.rds | awk '{print $1}')" = \
            "47b98e48ebf3891c151588c87691fee63760bdf8b66196dc4e7ffa3d0ae1f3fe"
          test "$(sha256sum data/search_index.rds | awk '{print $1}')" = \
            "a11a072d331afc72fe04aeedfe200bfab28a3122f59dfd556ee78901c0374f0e"
          test "$(sha256sum data/cascade_meta.rds | awk '{print $1}')" = \
            "00120c52a156fffe49146d952cfc3b871805ce8911869374e51fa2ac5b8d14de"
          test "$(sha256sum data/neon-cascade-codebook.csv | awk '{print $1}')" = \
            "a79cc754a0d984e8593fdbf84ccde518a6a6416a7bfbbc86d87e9de49a4138c3"
          test "$(sha256sum manifest.json | awk '{print $1}')" = \
            "92b46277d4aa9cee08941855a3693296298c14c74c774d7b5452f93a63441e79"
          git diff --check

  phenology-v2-seal1-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the literal Seal-1 revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert the literal requested revision
        run: |
          set -euo pipefail
          test "${#SOURCE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Install the exact sealed response and future-effect packages
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: survival@3.8-9, metafor@5.0-1
          pak-version: stable
          dependencies: '"hard"'
          cache-version: phenology-v2-seal1-ppm-2026-07-15-v1
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Verify the complete sealed runtime lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          path = Path("docs/receipts/phenology-v2-seal1-runtime.json")
          lock = json.loads(path.read_text(encoding="utf-8"))
          if lock.get("schema") != "phenology-v2-seal1-runtime-lock/v1":
              raise SystemExit("unexpected Phenology Seal-1 runtime-lock schema")
          if lock.get("registry_authority") != "61568339de3585db59e0ed73fed2d4b203a29bef":
              raise SystemExit("runtime lock does not name the merged Seal-0 authority")

          runtime = lock["runtime"]
          expected_runtime = {
              "os": "ubuntu-24.04",
              "platform": "x86_64-pc-linux-gnu",
              "r_version": "4.5.2",
              "repository": "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15",
              "renv_repository_override": "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15",
              "openblas_core": "Haswell",
              "openblas_threads": 1,
              "omp_threads": 1,
          }
          if runtime != expected_runtime:
              raise SystemExit("committed Phenology Seal-1 runtime authority drifted")
          if os.environ.get("RSPM") != runtime["repository"]:
              raise SystemExit("RSPM does not match the sealed runtime lock")
          if os.environ.get("RENV_CONFIG_REPOS_OVERRIDE") != runtime["renv_repository_override"]:
              raise SystemExit("RENV repository override does not match the sealed runtime lock")
          if os.environ.get("OPENBLAS_CORETYPE") != runtime["openblas_core"]:
              raise SystemExit("OpenBLAS core environment does not match the sealed runtime lock")
          if os.environ.get("OPENBLAS_NUM_THREADS") != str(runtime["openblas_threads"]):
              raise SystemExit("OpenBLAS thread environment does not match the sealed runtime lock")
          if os.environ.get("OMP_NUM_THREADS") != str(runtime["omp_threads"]):
              raise SystemExit("OMP thread environment does not match the sealed runtime lock")

          os_release = {}
          for line in Path("/etc/os-release").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  os_release[key] = value.strip('"')
          if os_release.get("ID") != "ubuntu" or os_release.get("VERSION_ID") != "24.04":
              raise SystemExit("runner is not the sealed Ubuntu 24.04 authority")

          r_meta = subprocess.run(
              ["Rscript", "--vanilla", "-e",
               "cat(as.character(getRversion()), R.version$platform, sep='\\n')"],
              check=True, text=True, capture_output=True).stdout.splitlines()
          if r_meta != [runtime["r_version"], runtime["platform"]]:
              raise SystemExit(f"R runtime mismatch: {r_meta!r}")

          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          lib.openblas_get_config.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          config = lib.openblas_get_config().decode("ascii")
          print(f"OpenBLAS core={core} threads={threads} config={config}")
          if core.lower() != runtime["openblas_core"].lower() or threads != runtime["openblas_threads"]:
              raise SystemExit("loaded OpenBLAS does not match the sealed runtime lock")

          direct = lock["direct_packages"]
          expected_direct = {
              "metafor": {
                  "package_ref": "metafor@5.0-1",
                  "version": "5.0-1",
                  "source_archive": "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15/src/contrib/metafor_5.0-1.tar.gz",
                  "source_archive_sha256": "953f1a43794a9d660225cad666849f1100263e5cad486fb8becc1ad32f81e73f",
              },
              "survival": {
                  "package_ref": "survival@3.8-9",
                  "version": "3.8-9",
                  "source_archive": "https://packagemanager.posit.co/cran/__linux__/noble/2026-07-15/src/contrib/survival_3.8-9.tar.gz",
                  "source_archive_sha256": "741f925dca22ef8f0aa67f798df19148ad56be3b09e8c8eea09e351ac5f99282",
              },
          }
          observed_direct = {
              row["package"]: {
                  key: row[key] for key in (
                      "package_ref", "version", "source_archive",
                      "source_archive_sha256")
              }
              for row in direct
          }
          if len(observed_direct) != len(direct) or observed_direct != expected_direct:
              raise SystemExit("direct package/archive authorities drifted")
          for package, authority in expected_direct.items():
              digest = hashlib.sha256()
              request = urllib.request.Request(
                  authority["source_archive"],
                  headers={"User-Agent": "NEON-Driver-Cascade-Seal1-CI/1"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  while chunk := response.read(1024 * 1024):
                      digest.update(chunk)
              if digest.hexdigest() != authority["source_archive_sha256"]:
                  raise SystemExit(f"{package} source archive digest mismatch")

          inventory = lock["package_inventory"]
          names = [row["package"] for row in inventory]
          if names != sorted(names, key=lambda value: value.encode("utf-8")) or len(names) != len(set(names)):
              raise SystemExit("package inventory is not unique radix order")
          canonical = "".join(
              f'{row["package"]}\t{row["version"]}\t{row["priority"]}\t{row["authority"]}\n'
              for row in inventory).encode("utf-8")
          digest = hashlib.sha256(canonical).hexdigest()
          expected_inventory_contract = {
              "roots": ["metafor", "survival"],
              "dependency_types": ["Depends", "Imports", "LinkingTo"],
              "includes_implicit_base": True,
              "excludes_installer_only_packages": True,
              "ordering": "R sort(method = 'radix') on package",
              "canonical_row": "package<TAB>version<TAB>priority<TAB>authority<LF>",
              "inventory_sha256": "b2263019cdcd50af0230c0fb69b1422ef064e55b2ecbe521bde6548cb9846f0f",
          }
          if lock["inventory_contract"] != expected_inventory_contract:
              raise SystemExit("package inventory contract drifted")
          if digest != expected_inventory_contract["inventory_sha256"]:
              raise SystemExit("package inventory digest mismatch")

          r_inventory = r'''
          args <- commandArgs(trailingOnly = TRUE)
          for (package in args) {
            description <- utils::packageDescription(package)
            priority <- description$Priority
            if (is.null(priority) || length(priority) != 1L || is.na(priority)) priority <- "none"
            fields <- vapply(c("Depends", "Imports", "LinkingTo"), function(field) {
              value <- description[[field]]
              if (is.null(value) || length(value) != 1L || is.na(value)) ""
              else gsub("[\r\n]+", " ", value)
            }, character(1L))
            cat(package, as.character(description$Version), priority,
                paste(fields, collapse = "\037"), sep = "\t")
            cat("\n")
          }
          '''
          observed_text = subprocess.run(
              ["Rscript", "--vanilla", "-e", r_inventory, *names],
              check=True, text=True, capture_output=True).stdout
          observed = {}
          hard_dependencies = set()
          for line in observed_text.splitlines():
              package, version, priority, fields = line.split("\t", 3)
              observed[package] = (version, priority)
              for field in fields.split("\x1f"):
                  for entry in field.split(","):
                      match = re.match(r"^\s*([A-Za-z][A-Za-z0-9.]*)", entry)
                      if match and match.group(1) != "R":
                          hard_dependencies.add(match.group(1))
          expected = {row["package"]: (row["version"], row["priority"])
                      for row in inventory}
          if observed != expected:
              raise SystemExit(f"installed package inventory mismatch: {observed!r}")
          missing = sorted(hard_dependencies.difference(expected))
          if missing:
              raise SystemExit(f"runtime lock omits hard dependencies: {missing!r}")
          print(f"Phenology Seal-1 runtime lock verified ({len(inventory)} packages; {digest})")
          PY

      - name: Verify immutable Phenology identities without checking out data
        env:
          PHENOLOGY_ORIGIN: https://github.com/tgilbert14/NEON-Plant-Phenology-Explorer.git
          PHENOLOGY_CURRENT_DATA: 7d0f29f7886cfae1c760a9ffc9e056184ec6fc68
          PHENOLOGY_CURRENT_CANDIDATE: 3089dc8e527340245735efbc62c95aa2faee5b25
          PHENOLOGY_GENERATOR: 256989a91d4502feca0b54cea77a24dfe9a02fca
          PHENOLOGY_CURRENT_KNOWLEDGE: 30be615dc438b60e4fa6454973b3b42589b22234
          PHENOLOGY_LEGACY: 81e339e9ed6f34d3d04ca45a7030fea51c4147a5
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/phenology-authorities.git"
          git init --quiet --bare "$repo"
          git -C "$repo" remote add origin "$PHENOLOGY_ORIGIN"
          test "$(git -C "$repo" remote get-url origin)" = "$PHENOLOGY_ORIGIN"
          for commit in "$PHENOLOGY_CURRENT_DATA" "$PHENOLOGY_CURRENT_CANDIDATE" \
                        "$PHENOLOGY_GENERATOR" "$PHENOLOGY_CURRENT_KNOWLEDGE" \
                        "$PHENOLOGY_LEGACY"; do
            git -C "$repo" fetch --quiet --no-tags --filter=blob:none origin "$commit"
            test "$(git -C "$repo" rev-parse 'FETCH_HEAD^{commit}')" = "$commit"
            git -C "$repo" cat-file -e "$commit^{commit}"
          done
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_CURRENT_CANDIDATE^1")" = "$PHENOLOGY_GENERATOR"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_CURRENT_DATA^1")" = "$PHENOLOGY_GENERATOR"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_CURRENT_DATA^2")" = "$PHENOLOGY_CURRENT_CANDIDATE"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_CURRENT_KNOWLEDGE^1")" = "$PHENOLOGY_CURRENT_DATA"
          git -C "$repo" merge-base --is-ancestor "$PHENOLOGY_CURRENT_DATA" "$PHENOLOGY_CURRENT_KNOWLEDGE"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_CURRENT_DATA:data/sites")" = "5a8fd457069d6dcca8dcd0dac9851528509032c6"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_CURRENT_KNOWLEDGE:data/sites")" = "5a8fd457069d6dcca8dcd0dac9851528509032c6"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_LEGACY:data/sites")" = "30abe869b0f78931929c21e544ffc85ec2238e35"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_CURRENT_DATA:manifest.json")" = "dcc9433975c2d19b6b128a77c2304fd844c268e9"
          test "$(git -C "$repo" rev-parse "$PHENOLOGY_CURRENT_KNOWLEDGE:manifest.json")" = "dcc9433975c2d19b6b128a77c2304fd844c268e9"
          test "$(git -C "$repo" cat-file blob "$PHENOLOGY_CURRENT_KNOWLEDGE:manifest.json" | sha256sum | awk '{print $1}')" = "512737700fdad555264737303439a1816eb189f5ec456e7420aa40dc9165d29b"

      - name: Run all Seal-1 contracts twice in isolated clean processes
        env:
